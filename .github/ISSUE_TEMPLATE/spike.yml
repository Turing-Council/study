name: Time-boxed Spike
description: Investigate an open technical question and produce an ADR
labels: ["type:spike"]
body:
  - type: input
    id: timebox
    attributes:
      label: Time-box
      placeholder: "3 days"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question to Answer
    validations:
      required: true
  - type: textarea
    id: exit_criteria
    attributes:
      label: Exit Criteria
      value: |
        - [ ] Working proof-of-concept or benchmark recorded
        - [ ] Decision committed in `docs/decisions/NNN-*.md`
    validations:
      required: true
